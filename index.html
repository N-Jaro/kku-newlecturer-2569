<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทำเนียบอบรมอาจารย์ใหม่ 2569</title>
    <!-- Include PapaParse for loading the Google Sheets CSV data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Include external stylesheet -->
    <link rel="stylesheet" href="team.css">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="header-main">
                <div class="header-title-area">
                    <h1 style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        ทำเนียบอบรมอาจารย์ใหม่ 2569
                        <span class="sync-indicator syncing" id="sync-indicator">
                            <span class="sync-dot"></span>
                            <span id="sync-text">กำลังซิงค์...</span>
                        </span>
                    </h1>
                    <p>พื้นที่รวบรวมข้อมูลและแบ่งปันประสบการณ์ของอาจารย์ใหม่ มหาวิทยาลัยขอนแก่น (มข.) มาร่วมแลกเปลี่ยน Tips & Tricks ในการทำงานวิชาการและการใช้ชีวิตในรั้ว มข. เพื่อเติบโตไปด้วยกัน!</p>
                </div>
                
                <div class="header-actions">
                    <button class="btn btn-secondary" id="filter-toggle-btn">
                        <!-- Filter Icon SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
                        </svg>
                        ตัวกรอง
                    </button>
                    <button class="btn btn-primary" id="share-btn">
                        <!-- Share Icon SVG -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
                        </svg>
                        แชร์ทำเนียบ
                    </button>
                </div>
            </div>
        </header>

        <!-- Search & Filter Panel (Collapsible) -->
        <div class="filter-panel" id="filter-panel">
            <div class="filter-grid">
                <div class="filter-group">
                    <label for="search-input">ค้นหาอาจารย์ใหม่</label>
                    <input type="text" id="search-input" class="filter-control" placeholder="ค้นหาด้วยชื่อ, คณะ, สาขาวิจัยที่สนใจ...">
                </div>
                <div class="filter-group">
                    <label for="filter-dept">กรองตามคณะ/หน่วยงาน</label>
                    <select id="filter-dept" class="filter-control">
                        <option value="">ทุกคณะและหน่วยงาน</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-team">กรองตามกลุ่ม</label>
                    <select id="filter-team" class="filter-control">
                        <option value="">ทุกกลุ่ม</option>
                        <option value="ดารา">กลุ่มดารา</option>
                        <option value="นครา">กลุ่มนครา</option>
                        <option value="พฤกษา">กลุ่มพฤกษา</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Team Members Grid -->
        <div class="team-grid" id="team-grid">
            <!-- Dynamically populated cards will go here -->
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #64748B;">
                กำลังโหลดข้อมูลอาจารย์ใหม่...
            </div>
        </div>
    </div>



    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast">
        <!-- Check Icon SVG -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#10B981" style="flex-shrink:0;">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
        <span id="toast-text">Success message goes here.</span>
    </div>

    <!-- Include local script -->
    <script src="team.js"></script>
</body>
</html>
